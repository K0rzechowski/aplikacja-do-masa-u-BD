<div class="h-175 flex justify-center items-center">
    <div class="container max-w-3/4 md:max-w-1/3 mx-auto w-full">
        <h2 class="text-4xl mb-4">Zaloguj się</h2>
        <form>
            <div>
                <label for="email">Adres e-mail</label>
                <input type="text" id="email" placeholder="E-mail" name="email" class="w-full p-2 border border-gray-300 rounded mb-4 bg-slate-300 text-slate-700"/>
            </div>
            <div>
                <label for="password">Hasło</label>
                <input type="password" id="password" placeholder="Hasło" name="password" class="w-full p-2 border border-gray-300 rounded mb-4 bg-slate-300 text-slate-800"/>
            </div>
            <div class="lg:flex lg:justify-between mb-4">
                <div>
                    <input type="checkbox" id="remember" name="remember" class="mr-2"/>
                    <label for="remember">Zapamiętaj mnie</label>
                </div>
                <p>Zapomniałeś/aś hasła?</p>
            </div>
            <div>
                <button class="btn-long btn-sky mb-4">Zaloguj się</button>
            </div>
        </form>
        <hr class="mb-4 h-px bg-slate-400 border-0">
        <div class="mb-4 text-slate-600">
            <p>Nie masz jeszcze konta? <a class="text-emerald-700">Zarejestruj się</a></p>
        </div>
    </div>
</div>
