<div>
    <div class="d-flex justify-content-between p-5">
        <div class="flex justify-between items-center mb-2">
            @if (currentDayAvailability) {
                <h2 mat-dialog-title>Edytuj dostępność</h2>
            } @else {
                <h2 mat-dialog-title>Dodaj dostępność</h2>
            }
            <button mat-dialog-close class="p-1 btn">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#008081"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
            </button>
        </div>
        <mat-dialog-content >
            <p class="text-lg color-slate-800 mb-2">{{ formatDate(data.day) }}</p>
            <form [formGroup]="formModel" (ngSubmit)="submitForm()">
                <div class="mb-2">
                    <mat-form-field  class="w-full">
                        <mat-label>Wybierz dostępność</mat-label>
                        <mat-select formControlName="type">
                            @for (type of types; track type ) {
                                <mat-option [value]="type">{{ AvailabilityTypeLabels[type] }}</mat-option>
                            }
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="grid-cols-2">
                    @if (currentDayAvailability) {
                        <button class="btn-long btn-sky cursor-pointer mb-4"> Zapisz</button>
                    } @else {
                        <button mat-button mat-dialog-close class="btn-long btn-sky mb-4 cursor-pointer" style="color: black; border-radius: 5px; background-color: #73D4FF;" (click)="submitForm()">Stwórz</button>
                    }
                </div>
            </form>
        </mat-dialog-content>
    </div>
</div>
