<div class="m-auto">
    <h1 class="text-5xl text-center my-5">Cennik usług</h1>
    @for (massage of massages; track $index) {
        <ul class=" m-auto max-w-3/4">
            <li class="w-full text-lg flex justify-between items-center p-3 m-2 rounded-md border border-slate-200 shadow-sm" [ngClass]="$index % 2 === 0 ? 'bg-sky-100' : 'bg-emerald-100'">
                <div>
                    <span class="font-medium">{{ massage.name }}</span> ({{ massage.minutes }} min)  
                </div>
                <span>{{ massage.price }} zł</span>
            </li>
        </ul>
    }
</div>
