<div>
    @if (isAdmin) {
    <div class="md:grid grid-cols-4 mb-6">
        <div class="md:col-span-3">
            <p class="text-4xl mb-2">Zarządzaj grafikami pracowników</p>
            <p class="text-lg mb-2">Przeglądaj i dodawaj grafiki</p>
        </div>
        <div class="md:col-span-1 flex justify-end items-start">
            <button class="btn btn-sky" (click)="openCreateScheduleDialog('0ms', '0ms')">+ Utwórz grafik</button>
        </div>
    </div>
    } @else if (isEmployee) {
    <div class="md:grid grid-cols-4 mb-6">
        <div class="md:col-span-3">
            <p class="text-4xl mb-2">Twój grafik</p>
            <p class="text-lg mb-2">Przeglądaj swoje przypisane zmiany</p>
        </div>
    </div>
    }

    <!-- Tabs -->
    <div class="mb-4 border-b border-gray-200 dark:border-gray-700">
        <ul class="flex flex-wrap -mb-px text-sm font-medium text-center" role="tablist">
            <li class="mr-2" role="presentation">
                <button class="inline-block p-4 border-b-2 rounded-t-lg"
                    [ngClass]="{'border-blue-600 text-blue-600': activeTab === 'employee', 'border-transparent hover:text-gray-600 hover:border-gray-300': activeTab !== 'employee'}"
                    (click)="setActiveTab('employee')" type="button" role="tab">
                    Według pracownika
                </button>
            </li>
            <li class="mr-2" role="presentation">
                <button class="inline-block p-4 border-b-2 rounded-t-lg"
                    [ngClass]="{'border-blue-600 text-blue-600': activeTab === 'location', 'border-transparent hover:text-gray-600 hover:border-gray-300': activeTab !== 'location'}"
                    (click)="setActiveTab('location')" type="button" role="tab">
                    Według pokoju
                </button>
            </li>
        </ul>
    </div>

    <!-- Tab Content -->
    <div id="myTabContent">
        <div [class.hidden]="activeTab !== 'employee'" class="p-4 rounded-lg bg-gray-50 dark:bg-gray-800"
            role="tabpanel">
            <div #employeeTimelineContainer></div>
        </div>
        <div [class.hidden]="activeTab !== 'location'" class="p-4 rounded-lg bg-gray-50 dark:bg-gray-800"
            role="tabpanel">
            <div #locationTimelineContainer></div>
        </div>
    </div>

    @if (isLoading) {
    <div class="flex justify-center items-center p-10">
        <div class="animate-spin rounded-full h-32 w-32 border-b-2 border-gray-900"></div>
    </div>
    }
</div>
