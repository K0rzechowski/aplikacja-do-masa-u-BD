<div class="h-200 flex justify-center items-center p-10">
    <div class="splash container py-5">
        <div class="max-w-3/4 mx-auto w-full">
            <h2 class="text-4xl mb-4">Załóż konto</h2>
            <form>
                <div class="md:flex md:justify-between md:space-x-2">
                    <div>
                        <label for="name">Imię</label>
                        <input type="text" id="name" placeholder="Imię" name="name" class="w-full p-2 border border-gray-300 rounded mb-4 bg-slate-300 text-slate-700"/>
                    </div>
                    <div>
                        <label for="surname">Nazwisko</label>
                        <input type="text" id="surname" placeholder="Nazwisko" name="surname" class="w-full p-2 border border-gray-300 rounded mb-4 bg-slate-300 text-slate-700"/>
                    </div>
                </div>
                <div class="md:block flex justify-between">
                    <label for="dateOfBirth">Data urodzenia</label>

                    <!-- Mobile: only icon -->
                    <div class="block md:hidden ">
                        <mat-datepicker-toggle class="p-0 m-0"[for]="picker"></mat-datepicker-toggle>
                    </div>
                    
                    <!-- Desktop: full input -->
                    <div class="hidden md:block">
                        <mat-form-field appearance="outline" class="date-input w-full mb-4 bg-slate-300 p-2 rounded">
                        <mat-label>Data urodzenia</mat-label>
                        <input matInput [matDatepicker]="picker">
                        <!-- TODO: format it to polish date -->
                        <mat-hint>MM/DD/YYYY</mat-hint>
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        </mat-form-field>
                    </div>
                    
                    <!-- Shared datepicker -->
                    <mat-datepicker #picker touchUi></mat-datepicker>
                </div>
                <div>
                    <label for="email">Adres e-mail</label>
                    <input type="text" id="email" placeholder="E-mail" name="email" class="w-full p-2 border border-gray-300 rounded mb-4 bg-slate-300 text-slate-700"/>
                </div>
                <div>
                    <label for="password">Hasło</label>
                    <input type="password" id="password" placeholder="Hasło" name="password" class="w-full p-2 border border-gray-300 rounded mb-4 bg-slate-300 text-slate-700"/>
                </div>
                <div>
                    <label for="passwordAgain">Powtórz hasło</label>
                    <input type="password" id="passwordAgain" placeholder="Hasło" name="passwordAgain" class="w-full p-2 border border-gray-300 rounded mb-4 bg-slate-300 text-slate-700"/>
                </div>
                <div class="lg:flex lg:justify-between mb-4">
                    <div>
                        <input type="checkbox" id="remember" name="remember" class="mr-2"/>
                        <label for="remember">Zapamiętaj mnie</label>
                    </div>
                </div>
                <div>
                    <button class="btn-long btn-sky mb-4">Zarejestruj się</button>
                </div>
            </form>
            <hr class="mb-4 h-px bg-slate-400 border-0">
            <div class="text-slate-600">
                <p>Masz już konto? <a routerLink="/login" class="text-emerald-800">Zaloguj się</a></p>
            </div>
        </div>
    </div>
</div>
