<h2 class="text-4xl mb-4">Twoje wizyty</h2>
<mat-tab-group>
    <mat-tab label="Nadchodzące wizyty">
        @for (res of upcomingReservations; track res) {
            <app-reservation-card [reservation]="res" (reservationCancelled)="onReservationCancelled($event)" (reservationCompleted)="onReservationCompleted($event)"></app-reservation-card>
        } @empty {
            <p class="text-center text-slate-600 col-span-4 p-2">Brak nadchodzących wizyt.</p>
        }
    </mat-tab>
    <mat-tab label="Wykonane wizyty">
        @for (res of pastReservations; track res) {
            <app-reservation-card [reservation]="res" (reservationCancelled)="onReservationCancelled($event)" (reservationCompleted)="onReservationCompleted($event)"></app-reservation-card>
        } @empty {
            <p class="text-center text-slate-600 col-span-4 p-2">Brak wykonanych wizyt.</p>
        }
    </mat-tab>
    <mat-tab label="Anulowane wizyty">
        @for (res of cancelledReservations; track res) {
            <app-reservation-card [reservation]="res"></app-reservation-card>
        } @empty {
            <p class="text-center text-slate-600 col-span-4 p-2">Brak anulowanych wizyt.</p>
        }
    </mat-tab>
</mat-tab-group>
