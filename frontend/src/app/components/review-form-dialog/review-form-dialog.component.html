<div class="p-5">
    <div class="flex justify-between items-center mb-2">
        <h2 mat-dialog-title>Oceń wizytę</h2>
        <button mat-dialog-close class="p-1 btn">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#008081"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
        </button>
    </div>
    <form [formGroup]="formModel" (ngSubmit)="submit()">
        <p class="mb-1">Ocena</p>
        <div class="flex text-amber-500 mb-1" role="radiogroup" aria-label="Ocena">
            @for (star of stars; track star) {
                <button type="button" class="cursor-pointer" role="radio"
                    [attr.aria-checked]="formModel.value.rating === star"
                    [attr.aria-label]="star + ' na 5'"
                    (click)="setRating(star)">
                    <mat-icon>{{ star <= (formModel.value.rating || 0) ? 'star' : 'star_border' }}</mat-icon>
                </button>
            }
        </div>
        <p class="warning mb-2">
            @if (formModel.controls['rating'].invalid && formModel.controls['rating'].touched) {
                Wybierz ocenę od 1 do 5
            }
        </p>

        <label for="comment">Komentarz (opcjonalnie)</label>
        <textarea id="comment" rows="4" formControlName="comment" placeholder="Jak oceniasz wizytę?"
            class="w-full p-2 border border-gray-300 rounded bg-slate-300 text-slate-700 mb-2"></textarea>
        <p class="warning mb-2">
            @if (formModel.controls['comment'].errors?.['maxlength']) {
                Komentarz może mieć maksymalnie 1000 znaków
            }
        </p>

        <button type="submit" class="btn-long btn-sky mb-2 cursor-pointer" [disabled]="isSaving"
            style="color: black; border-radius: 5px; background-color: #73D4FF;">
            {{ isSaving ? 'Zapisywanie...' : 'Wyślij opinię' }}
        </button>
    </form>
</div>
