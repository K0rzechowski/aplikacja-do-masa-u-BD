
<div class="d-flex justify-content-between p-5">
    <div class="flex justify-between items-center mb-2">
        <h2 mat-dialog-title>Stwórz grafik</h2>
        <button mat-dialog-close class="p-1 btn">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#008081"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
        </button>
    </div>
    <mat-dialog-content>
        <form [formGroup]="formModel">
            <label for="startTime" class="flex justify-center items-center">Wybierz datę rozpoczęcia tygodnia</label>
            <div class="flex justify-center items-center mb-4">
                <mat-form-field>
                    <mat-label>Data rozpoczęcia</mat-label>
                    <input matInput [matDatepicker]="startPicker" formControlName="startTime">
                    <mat-hint>DD/MM/YYYY</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
                </mat-form-field>
                <mat-datepicker #startPicker></mat-datepicker>      
                
            </div>
            <p class="warning text-center mb-2">
                @if(formModel.controls['startTime'].touched && formModel.get('startTime')?.errors?.['notMonday']) {
                    Wybrany dzień musi być poniedziałkiem
                }
            </p>
            <button 
                mat-button
                class="btn-long btn-sky mb-4 cursor-pointer"
                [class.cursor-progress]="isProcessing()"
                [class.cursor-pointer]="!isProcessing()"
                style="color: black; border-radius: 5px; background-color: #73D4FF;" 
                (click)="createSchedule()">
                {{ getStatusMessage() }}
            </button>
        </form>
    </mat-dialog-content>
</div>
