<div>
    <div class="d-flex justify-content-between p-5">
        @if(!room) {
            <div class="flex justify-between items-center mb-2">
                <h2 mat-dialog-title>Dodaj salę</h2>
                <button mat-dialog-close class="p-1 btn">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#008081"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                </button>
            </div>
            
        }
        <form #roomForm="ngForm" (ngSubmit)="submitForm(roomForm)">
            <div class="mb-4 md:mb-0">
                <label for="number">Numer sali</label>
                <input type="text" name="number" placeholder="{{room?.roomNumber || 'Numer sali'}}" 
                #numberInput="ngModel"
                [(ngModel)]="roomNumber" class="w-full p-2 border border-gray-300 rounded bg-slate-300 text-slate-700 mb-2" required/>
                <p class="warning">
                    @if(numberInput.invalid && numberInput.touched ) {
                        Numer sali jest wymagany
                    }
                </p>
            </div>
                
            <div class="grid-cols-2">
                @if (room) {
                    <button class="btn-long btn-sky cursor-pointer mb-4"> Zapisz</button>
                } @else {
                    <button mat-button mat-dialog-close class="btn-long btn-sky mb-4 cursor-pointer" style="color: black; border-radius: 5px; background-color: #73D4FF;" (click)="submitForm(roomForm)">Stwórz</button>
                }
            </div>
        </form>
    </div>
</div>
